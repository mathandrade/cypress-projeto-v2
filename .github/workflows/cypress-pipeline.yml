# .github/workflows/cypress-pipeline.yml
name: Run Basic Cypress Tests

# Em que momento será executada
on:
  pull_request:
    branches: [master]
  
#jobs que irao rodar na pipeline
# só temo s um que vai rodar os testes do cypress
jobs:
  cypress-run:
    # Máquina que irá rodar a pipeline
    runs-on: ubuntu-latest
       
    # Passos que serão executados
     steps:
            #clone do projeto
            -name: checkout/clone do projeto
            uses: actions/checkout@v6

            #exemplo de execução no terminal
           # -name: Run testes
            #uses: cypress-io/github-action@v7

            -name: instalar dependências
            run: echo Mateus 
           # execução e configuração do projeto
            with:
                record: true
            env:
                    CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}